name: CI

on:
  push:
    branches: [ main ]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ ubuntu-latest, macos-latest ]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      # WASM 工具链：wasm 相关测试（wasm_target_test.rs）在工具缺失时优雅跳过，
      # 因此安装尽可能多的组件即可；缺失部分不影响其余测试。
      - name: Install WASM toolchain (macOS)
        if: runner.os == 'macOS'
        run: brew install lld wasmtime wasi-libc

      - name: Install WASM toolchain (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y lld clang wasmtime || true
          sudo apt-get install -y libwasi-libc-dev || true

      - name: Build
        run: cargo build --workspace

      - name: Test
        # 串行测试线程：driver 集成测试会 spawn clang 编译，并行时进程资源
        # 耗尽（os error 35，EMFILE/EPROCLIM）导致偶发失败，故限制为 1
        run: cargo test --workspace -- --test-threads=1

      # SH-P2-5 C2：快照回归（差分 harness 比对运行行为基线）
      - name: Snapshot regression (diff harness)
        run: python3 scripts/diff_harness.py check --manifest tests/snapshot-baseline.txt --dims run

      # SH-P2-5 C2 扩充：IR 探针回归（小子集 IR 快照，捕获 IR 级回归 / 非确定性）
      - name: IR probe regression (diff harness)
        run: python3 scripts/diff_harness.py check --probe

      # E1：macOS 双架构交叉编译冒烟（本机 clang 直链 SDK，已在本机验证）
      - name: Cross-compile smoke (macOS dual-arch)
        if: runner.os == 'macOS'
        run: |
          cargo run -p rlyeh-driver -- build examples/hello-world.rl --target arm64-apple-macosx -o /tmp/hello-arm64
          cargo run -p rlyeh-driver -- build examples/hello-world.rl --target x86_64-apple-macosx -o /tmp/hello-x86_64
          /tmp/hello-arm64 | grep -q "Hello, Rlyeh!"
          /tmp/hello-x86_64 | grep -q "Hello, Rlyeh!"

      # E2：WASM 编译 + wasmtime 运行冒烟（工具缺失时跳过）
      - name: WASM smoke
        run: |
          if ! command -v wasmtime >/dev/null; then echo "wasmtime missing, skipping"; exit 0; fi
          cargo run -p rlyeh-driver -- build examples/hello-world.rl --target wasm32-wasi -o /tmp/hello.wasm
          wasmtime /tmp/hello.wasm | grep -q "Hello, Rlyeh!"
