name: Release

on:
  push:
    tags: [ 'v*' ]

permissions:
  contents: write

jobs:
  release:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            target: aarch64-apple-darwin
            name: zeta-macos-arm64
            ext: ''
          - os: macos-latest
            target: x86_64-apple-darwin
            name: zeta-macos-x86_64
            ext: ''
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            name: zeta-linux-x86_64
            ext: ''
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            name: zeta-windows-x86_64
            ext: .exe
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Build release binary
        shell: bash
        run: |
          cargo build -p zeta-driver --release --target ${{ matrix.target }}
          mkdir -p dist
          cp target/${{ matrix.target }}/release/zeta-driver${{ matrix.ext }} dist/${{ matrix.name }}${{ matrix.ext }}

      - name: Upload to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/${{ matrix.name }}${{ matrix.ext }}
