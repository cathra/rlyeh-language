[package]
name = "rlyeh-check"
version.workspace = true
edition.workspace = true
description = "Rlyeh 语言静态分析器（lint：未使用变量、恒常条件、冗余比较、不可达代码）"

[dependencies]
rlyeh-ast = { workspace = true }
rlyeh-lexer = { workspace = true }
rlyeh-parser = { workspace = true }

[[bin]]
name = "rlyeh-check"
path = "src/main.rs"

[lib]
path = "src/lib.rs"
