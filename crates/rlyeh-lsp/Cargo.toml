[package]
name = "rlyeh-lsp"
version.workspace = true
edition.workspace = true
description = "Rlyeh 语言服务器（LSP over stdio）：文档同步 + 诊断推送（复用 rlyeh-check 静态分析）"

[dependencies]
rlyeh-check = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }

[[bin]]
name = "rlyeh-lsp"
path = "src/main.rs"

[lib]
path = "src/lib.rs"
